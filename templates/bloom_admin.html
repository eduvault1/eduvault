{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-slate-50 dark:bg-slate-950 px-4 py-8"><div class="max-w-5xl mx-auto space-y-6">
<header><p class="text-xs font-black uppercase tracking-widest text-purple-600">Administrator tools</p><h1 class="text-3xl font-black text-slate-900 dark:text-white mt-2">Bloom's Taxonomy Question Review</h1><p class="text-slate-600 dark:text-slate-300 mt-2">Search existing questions, assign the cognitive categories that match their learning objective, and mark the classification confidence.</p></header>
<div class="flex gap-2"><input id="query" class="flex-1 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 p-3" placeholder="Search question text (at least 2 characters)"><button id="search" class="rounded-xl bg-purple-700 text-white px-5 font-bold">Search</button></div><p id="message" class="text-sm" role="status"></p><div id="results" class="space-y-4"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);const categories=['Remember','Understand','Apply','Analyze','Evaluate','Create'];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function search(){const q=$('query').value.trim();if(q.length<2){$('message').textContent='Enter at least two characters.';return;}$('message').textContent='Searching…';try{const r=await fetch('/api/admin/questions/search?q='+encodeURIComponent(q));const d=await r.json();if(!r.ok)throw Error(d.error||'Search failed');const box=$('results');box.replaceChildren();if(!(d.items||[]).length){$('message').textContent='No matching questions found.';return;}$('message').textContent=`Found ${d.items.length} questions.`;d.items.forEach(item=>{const card=document.createElement('section');card.className='bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5';const title=document.createElement('h2');title.className='font-black';title.textContent=`Question #${item.id} · ${item.subject} Grade ${item.grade}`;const text=document.createElement('p');text.className='text-sm my-3 whitespace-pre-wrap';text.textContent=item.question_text;const checks=document.createElement('div');checks.className='grid grid-cols-2 sm:grid-cols-3 gap-2';categories.forEach(c=>{const label=document.createElement('label');label.className='flex items-center gap-2 rounded-lg border p-2 text-sm';const input=document.createElement('input');input.type='checkbox';input.value=c;input.checked=(item.bloom_tags||[]).some(t=>t.category===c);input.className='bloom';label.append(input,document.createTextNode(c));checks.append(label)});const row=document.createElement('div');row.className='flex flex-wrap items-center gap-3 mt-4';const confidence=document.createElement('select');confidence.className='rounded-lg border p-2 text-slate-900';[['Reviewed','Reviewed'],['High','High confidence'],['Medium','Medium confidence'],['Low','Low confidence'],['Unverified','Unverified']].forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;confidence.append(o)});confidence.value=(item.bloom_tags||[])[0]?.confidence||'Reviewed';const save=document.createElement('button');save.className='rounded-lg bg-purple-700 text-white px-4 py-2 font-bold';save.textContent='Save categories';save.addEventListener('click',async()=>{save.disabled=true;try{const selected=[...checks.querySelectorAll('input:checked')].map(x=>x.value);const resp=await fetch(`/api/admin/questions/${item.id}/bloom-tags`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({categories:selected,confidence:confidence.value})});const result=await resp.json();if(!resp.ok)throw Error(result.error||'Save failed');save.textContent='Saved';}catch(e){$('message').textContent=e.message;}finally{save.disabled=false}});row.append(confidence,save);card.append(title,text,checks,row);box.append(card)})}catch(e){$('message').textContent=e.message}}
$('search').addEventListener('click',search);$('query').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script>
{% endblock %}
